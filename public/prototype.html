  <meta name="description" content="Beheerplatform voor advocaat-bewindvoerders: PSD2 multibanking, OCR-factuurverwerking, SEPA betaalbatches, 1-klik CRBP jaarverslag en WZC zorgportaal." />

                Balie / CRBP Sync
              </span>
            </div>
            <p class="text-xs text-[var(--muted-foreground)]">Advocatenkantoor De Smet &amp; Partners • 48 Actieve Bewindsy-dossiers</p>

        </div>

    </header>

    // --- HELPER UTILITIES ---
    function getActiveDossier() {
      return state.dossiers.find((d) => d.id === state.activeDossierId) || state.dossiers[0];
    }

    function formatEUR(amount) {
      return new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" }).format(amount);
    }

    function showToast(title, message) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className =
        "bg-[var(--card)] text-[var(--foreground)] border border-[var(--primary)] rounded-xl p-4 shadow-lg transition-all";
      toast.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-semibold text-[var(--foreground)]">${title}</p>
            <p class="text-xs text-[var(--muted-foreground)] mt-1">${message}</p>
          </div>
          <span class="text-xs px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">OK</span>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 4200);
    }

    function openModal(title, subtitle, bodyHtml, footerHtml) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-subtitle").textContent = subtitle;
      document.getElementById("modal-body").innerHTML = bodyHtml;
      document.getElementById("modal-footer").innerHTML = footerHtml || "";
      const backdrop = document.getElementById("modal-backdrop");
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    }

    document.getElementById("modal-close-btn").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });

            `<option value="${dos.id}" ${dos.id === d.id ? "selected" : ""}>${dos.name} (${dos.age}j) — ${dos.crbpRef}</option>`
        )
        .join("");

      // Role buttons
      const adminBtn = document.getElementById("role-admin-btn");
      const careBtn = document.getElementById("role-care-btn");
      if (state.roleMode === "admin") {
        adminBtn.className = "px-3 py-1 rounded-md text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)]";
        careBtn.className = "px-3 py-1 rounded-md text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)]";
      } else {
        careBtn.className = "px-3 py-1 rounded-md text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)]";
        adminBtn.className = "px-3 py-1 rounded-md text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)]";
      }

      // Banner Left
      const bannerLeft = document.getElementById("dossier-banner-left");
      bannerLeft.innerHTML = `
        <div>
          <span class="text-xs text-[var(--muted-foreground)]">Beschermde persoon:</span>
          <strong class="text-xs font-semibold ml-1">${d.name} (${d.birthDate})</strong>
        </div>
        <div>
          <span class="text-xs text-[var(--muted-foreground)]">Bevoegde rechter:</span>
          <strong class="text-xs font-semibold ml-1">${d.canton}</strong>
        </div>
        <div>
          <span class="text-xs text-[var(--muted-foreground)]">Verblijf:</span>
          <strong class="text-xs font-semibold ml-1">${d.livingSituation}</strong>
        </div>
        <div>
          <span class="text-xs text-[var(--muted-foreground)]">Zorgprofiel:</span>
          <span class="text-xs font-medium px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] ml-1">${d.katzScale} • ${d.mutuality}</span>
        </div>
      `;

      // Banner Right
      const bannerRight = document.getElementById("dossier-banner-right");
      if (state.roleMode === "care") {
        bannerRight.innerHTML = `
          <span class="text-xs px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--card)] font-medium">
            GDPR-afgeschermde weergave: Enkel leefgeld- &amp; zorgaanvraagstatus zichtbaar
          </span>
        `;
      } else {
        bannerRight.innerHTML = `
          <span class="text-xs text-[var(--muted-foreground)]">Volgend CRBP-verslag: <strong class="text-[var(--foreground)]">${d.reportDue}</strong></span>
        `;
      }

      // Badges
      const readyInvoices = d.invoices.filter((i) => i.status === "READY").length;
      const pendingCare = d.careRequests.filter((c) => c.status === "PENDING").length;
      const activeContracts = d.contracts.filter((c) => c.status === "ACTIVE").length;

      document.getElementById("badge-invoices").textContent = readyInvoices;
      document.getElementById("badge-invoices").className =
        "px-2 py-0.5 rounded-full text-xs bg-[var(--secondary)] text-[var(--secondary-foreground)]";

      document.getElementById("badge-care").textContent = pendingCare;
      document.getElementById("badge-care").className =
        "px-2 py-0.5 rounded-full text-xs bg-[var(--secondary)] text-[var(--secondary-foreground)]";

      document.getElementById("badge-contracts").textContent = activeContracts;
      document.getElementById("badge-contracts").className =
        "px-2 py-0.5 rounded-full text-xs bg-[var(--secondary)] text-[var(--secondary-foreground)]";

      // Active Tab styling
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        const tab = btn.getAttribute("data-tab");
        if (tab === state.activeTab) {
          btn.className =
            "tab-btn px-4 py-2 rounded-lg text-xs font-semibold transition-all whitespace-nowrap flex items-center gap-2 bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm";
        } else {
          btn.className =
            "tab-btn px-4 py-2 rounded-lg text-xs font-medium transition-all whitespace-nowrap flex items-center gap-2 text-[var(--muted-foreground)] hover:bg-[var(--secondary)] hover:text-[var(--foreground)]";
        }
      });

      renderWorkspace();
    }

    // --- WORKSPACE DISPATCHER ---
    function renderWorkspace() {
      const container = document.getElementById("workspace-view");
      if (state.activeTab === "financial") {
        container.innerHTML = renderFinancialTab();
        bindFinancialEvents();
      } else if (state.activeTab === "crbp") {
        container.innerHTML = renderCrbpTab();
        bindCrbpEvents();
      } else if (state.activeTab === "care") {
        container.innerHTML = renderCareTab();
        bindCareEvents();
      } else if (state.activeTab === "estate") {
        container.innerHTML = renderEstateTab();
        bindEstateEvents();
      }
    }

    // =========================================================================
    // TAB 1: FINANCIEEL, PSD2 MULTIBANKING & OCR FACTUURHUB
    // =========================================================================
    function renderFinancialTab() {
      const d = getActiveDossier();
      const readyInvoices = d.invoices.filter((i) => i.status === "READY");
      const selectedInvoices = readyInvoices.filter((i) => i.selected);
      const batchTotal = selectedInvoices.reduce((acc, i) => acc + i.amount, 0);
      const projectedBalance = d.accounts.management.balance - batchTotal;
      const bufferHealthy = projectedBalance >= d.minBuffer;

      if (state.roleMode === "care") {
        return `
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-6 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-base font-semibold">Leefgeld &amp; Comfortbudget Status (WZC Inzage)</h2>
                <p class="text-xs text-[var(--muted-foreground)] mt-1">
                  Conform de GDPR en het beroepsgeheim van de bewindvoerder zijn de beheerrekening en spaarrekeningen afgeschermd.
                </p>
              </div>
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)]">
                Leefgeld Actief: ${formatEUR(d.weeklyAllowance)} / week
              </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div class="p-4 rounded-xl border border-[var(--border)] bg-[var(--background)]">
                <p class="text-xs text-[var(--muted-foreground)]">Huidig saldo zakgeld-/leefgeldrekening (${d.accounts.allowance.iban})</p>
                <p class="text-xl font-bold mt-1">${formatEUR(d.accounts.allowance.balance)}</p>
                <p class="text-xs text-[var(--muted-foreground)] mt-1">Volgende automatische storting: maandagochtend 08:00</p>
              </div>
              <div class="p-4 rounded-xl border border-[var(--border)] bg-[var(--background)] flex flex-col justify-between">
                <div>
                  <p class="text-xs text-[var(--muted-foreground)]">Ruimte voor extra zorgaanvragen deze maand</p>
                  <p class="text-base font-semibold mt-1">Ruim voldoende (Groen licht voor kleine uitgaven tot € 250)</p>
                </div>
                <button
                  type="button"
                  id="jump-to-care-btn"
                  class="mt-3 self-start px-3 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold"
                >
                  Dien een Zorgaanvraag in →
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-6">
          <!-- PSD2 Multibanking Cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Beheerrekening -->
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Beheerrekening (PSD2 Live)</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">Ibanity Sync</span>
                </div>
                <p class="text-2xl font-bold mt-2">${formatEUR(d.accounts.management.balance)}</p>
                <p class="text-xs text-[var(--muted-foreground)] mt-1 font-mono">${d.accounts.management.iban} • ${d.accounts.management.bank}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-[var(--border)] flex items-center justify-between text-xs">
                <span class="text-[var(--muted-foreground)]">Minimumbuffer ingesteld:</span>
                <span class="font-semibold">${formatEUR(d.minBuffer)}</span>
              </div>
            </div>

            <!-- Leefgeldrekening + Periodieke Automatisatie -->
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Leefgeldrekening (Zakgeld)</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">Elke maandag</span>
                </div>
                <p class="text-2xl font-bold mt-2">${formatEUR(d.accounts.allowance.balance)}</p>
                <p class="text-xs text-[var(--muted-foreground)] mt-1 font-mono">${d.accounts.allowance.iban}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-[var(--border)] flex items-center justify-between gap-2 text-xs">
                <label for="allowance-input" class="text-[var(--muted-foreground)]">Wekelijks leefgeld (€):</label>
                <div class="flex items-center gap-1.5">
                  <input
                    id="allowance-input"
                    type="number"
                    min="20"
                    max="500"
                    step="5"
                    value="${d.weeklyAllowance}"
                    class="w-20 px-2 py-1 rounded border border-[var(--border)] bg-[var(--background)] text-xs font-semibold text-right"
                  />
                  <button
                    id="save-allowance-btn"
                    type="button"
                    class="px-2.5 py-1 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-semibold hover:opacity-90"
                  >
                    Bewaar
                  </button>
                </div>
              </div>
            </div>

            <!-- Spaarrekening -->
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Reserve &amp; Spaarrekening</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">Art. 499/7 BW</span>
                </div>
                <p class="text-2xl font-bold mt-2">${formatEUR(d.accounts.savings.balance)}</p>
                <p class="text-xs text-[var(--muted-foreground)] mt-1 font-mono">${d.accounts.savings.iban}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-[var(--border)] flex items-center justify-between text-xs">
                <span class="text-[var(--muted-foreground)]">Opname vereist machtiging:</span>
                <span class="font-semibold">Vrederechter</span>
              </div>
            </div>
          </div>

          <!-- Smart OCR & Peppol Invoice Queue -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-6 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-base font-semibold">Slimme Factuurverwerking (OCR &amp; Peppol) → SEPA Betaalbatch</h2>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                  Inkomende facturen worden automatisch uitgelezen op IBAN, Modulo-97 OGM en gekoppeld aan de wettelijke CRBP-rubriek.
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2.5">
                <button
                  id="simulate-ocr-btn"
                  type="button"
                  class="px-3.5 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-semibold transition-colors"
                >
                  + Simuleer Inkomende Factuur (OCR Scan)
                </button>
                <button
                  id="generate-sepa-btn"
                  type="button"
                  ${selectedInvoices.length === 0 ? "disabled" : ""}
                  class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold shadow-sm hover:opacity-95 disabled:opacity-40 transition-opacity"
                >
                  Genereer SEPA Batch (${selectedInvoices.length} facturen • ${formatEUR(batchTotal)})
                </button>
              </div>
            </div>

            <!-- Balance Guard Banner -->
            <div class="p-3.5 rounded-lg border border-[var(--border)] bg-[var(--background)] flex flex-wrap items-center justify-between gap-3 text-xs">
              <div>
                <span class="font-semibold">Automatische Saldobewaker:</span>
                <span class="text-[var(--muted-foreground)] ml-1">
                  Saldo na uitvoering geselecteerde batch:
                  <strong class="text-[var(--foreground)]">${formatEUR(projectedBalance)}</strong>
                  (Minimumbuffer: ${formatEUR(d.minBuffer)})
                </span>
              </div>
              <span class="px-2.5 py-1 rounded font-semibold ${
                bufferHealthy
                  ? "bg-[var(--secondary)] text-[var(--secondary-foreground)]"
                  : "bg-[var(--primary)] text-[var(--primary-foreground)]"
              }">
                ${bufferHealthy ? "✓ Ruim boven minimumbuffer — Leefgeld gegarandeerd" : "Let op: Buffer wordt aangesproken"}
              </span>
            </div>

            <!-- Invoices Table -->
            <div class="overflow-x-auto border border-[var(--border)] rounded-xl">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-xs text-[var(--muted-foreground)]">
                    <th class="py-3 px-4 w-10">Batch</th>
                    <th class="py-3 px-4">Leverancier &amp; Kanaal</th>
                    <th class="py-3 px-4">Gestructureerde Mededeling (OGM)</th>
                    <th class="py-3 px-4">CRBP-Rubriek (AI Tag)</th>
                    <th class="py-3 px-4">Vervaldatum</th>
                    <th class="py-3 px-4 text-right">Bedrag</th>
                    <th class="py-3 px-4 text-right">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border)] text-xs">
                  ${d.invoices
                    .map(
                      (inv) => `
                    <tr class="hover:bg-[var(--background)] transition-colors">
                      <td class="py-3.5 px-4">
                        <input
                          type="checkbox"
                          data-inv-id="${inv.id}"
                          class="inv-checkbox w-4 h-4 rounded cursor-pointer"
                          ${inv.selected && inv.status === "READY" ? "checked" : ""}
                          ${inv.status !== "READY" ? "disabled" : ""}
                          aria-label="Selecteer factuur ${inv.supplier}"
                        />
                      </td>
                      <td class="py-3.5 px-4">
                        <p class="font-semibold text-[var(--foreground)]">${inv.supplier}</p>
                        <p class="text-xs text-[var(--muted-foreground)] font-mono">${inv.iban} • ${inv.source} (${inv.confidence}% OCR)</p>
                      </td>
                      <td class="py-3.5 px-4 font-mono">
                        <span class="px-2 py-0.5 rounded bg-[var(--background)] border border-[var(--border)]">${inv.ogm}</span>
                        <span class="ml-1 text-xs text-[var(--muted-foreground)]">✓ Mod97</span>
                      </td>
                      <td class="py-3.5 px-4">
                        <select
                          data-inv-cat="${inv.id}"
                          aria-label="CRBP-rubriek voor ${inv.supplier}"
                          class="inv-cat-select bg-[var(--background)] border border-[var(--border)] rounded px-2 py-1 text-xs font-medium"
                        >
                          ${Object.entries(CRBP_CATEGORIES)
                            .filter(([, val]) => val.type === "EXPENSE")
                            .map(
                              ([code, val]) =>
                                `<option value="${code}" ${inv.crbpCode === code ? "selected" : ""}>${code}: ${val.label}</option>`
                            )
                            .join("")}
                        </select>
                      </td>
                      <td class="py-3.5 px-4">${inv.dueDate}</td>
                      <td class="py-3.5 px-4 text-right font-semibold">${formatEUR(inv.amount)}</td>
                      <td class="py-3.5 px-4 text-right">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                          inv.status === "PAID"
                            ? "bg-[var(--secondary)] text-[var(--muted-foreground)]"
                            : "bg-[var(--primary)] text-[var(--primary-foreground)]"
                        }">
                          ${inv.status === "PAID" ? "Betaald & Gecategoriseerd" : "Klaar voor SEPA"}
                        </span>
                      </td>
                    </tr>
                  `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function bindFinancialEvents() {
      const d = getActiveDossier();
      const jumpBtn = document.getElementById("jump-to-care-btn");
      if (jumpBtn) {
        jumpBtn.addEventListener("click", () => {
          state.activeTab = "care";
          renderShell();
        });
        return;
      }

      // Save weekly allowance
      document.getElementById("save-allowance-btn").addEventListener("click", () => {
        const val = parseFloat(document.getElementById("allowance-input").value);
        if (!isNaN(val) && val >= 20) {
          d.weeklyAllowance = val;
          showToast(
            "Leefgeldschema Bijgewerkt",
            `Automatische wekelijkse opdracht voor ${d.name} ingesteld op ${formatEUR(val)} met voorafgaande saldocheck.`
          );
          renderShell();
        }
      });

      // Checkbox toggle
      document.querySelectorAll(".inv-checkbox").forEach((cb) => {
        cb.addEventListener("change", (e) => {
          const invId = e.target.getAttribute("data-inv-id");
          const inv = d.invoices.find((i) => i.id === invId);
          if (inv) {
            inv.selected = e.target.checked;
            renderWorkspace();
          }
        });
      });

      // CRBP Category change
      document.querySelectorAll(".inv-cat-select").forEach((sel) => {
        sel.addEventListener("change", (e) => {
          const invId = e.target.getAttribute("data-inv-cat");
          const inv = d.invoices.find((i) => i.id === invId);
          if (inv) {
            inv.crbpCode = e.target.value;
            showToast(
              "CRBP-Rubriek Aangepast",
              `Factuur ${inv.supplier} gekoppeld aan rubriek ${inv.crbpCode} voor het jaarverslag.`
            );
          }
        });
      });

      // Simulate OCR Invoice
      document.getElementById("simulate-ocr-btn").addEventListener("click", () => {
        const sampleSuppliers = [
          {
            supplier: "CM Zorgwinkel (Verhuur Looprek & Matras)",
            iban: "BE61 0682 4099 1182",
            amount: 78.50,
            ogm: "+++210/4829/19073+++",
            crbpCode: "UIT-02",
            source: "OCR PDF Mailbox"
          },
          {
            supplier: "Fluvius / Engie Eindafrekening",
            iban: "BE49 2100 0008 8921",
            amount: 134.90,
            ogm: "+++609/1145/20856+++",
            crbpCode: "UIT-04",
            source: "Peppol e-Invoicing"
          },
          {
            supplier: "Ambulancedienst Antwerpen-Zuid",
            iban: "BE22 7310 4491 0082",
            amount: 92.40,
            ogm: "+++390/8112/64021+++",
            crbpCode: "UIT-02",
            source: "Doccle / eBox"
          }
        ];
        const pick = sampleSuppliers[d.invoices.length % sampleSuppliers.length];
        d.invoices.unshift({
          id: "inv-" + Date.now(),
          supplier: pick.supplier,
          iban: pick.iban,
          amount: pick.amount,
          ogm: pick.ogm,
          ogmValid: true,
          dueDate: "30/11/2026",
          crbpCode: pick.crbpCode,
          source: pick.source,
          confidence: 99,
          status: "READY",
          selected: true
        });
        showToast(
          "Nieuwe Factuur Gescand & Gekoppeld",
          `${pick.supplier} (${formatEUR(pick.amount)}) automatisch herkend en getagd onder ${pick.crbpCode}.`
        );
        renderShell();
      });

      // Generate SEPA XML Batch
      document.getElementById("generate-sepa-btn").addEventListener("click", () => {
        const selected = d.invoices.filter((i) => i.status === "READY" && i.selected);
        if (selected.length === 0) return;
        const total = selected.reduce((sum, i) => sum + i.amount, 0);
        const msgId = `CURATELA-${d.crbpRef.replace(/\//g, "-")}-${Date.now().toString().slice(-5)}`;

        const xmlTransactions = selected
          .map(
            (inv, idx) => `      <CdtTrfTxInf>
        <PmtId><EndToEndId>E2E-${idx + 1}-${inv.id}</EndToEndId></PmtId>
        <Amt><InstdAmt Ccy="EUR">${inv.amount.toFixed(2)}</InstdAmt></Amt>
        <Cdtr><Nm>${inv.supplier.replace(/&/g, "&amp;")}</Nm></Cdtr>
        <CdtrAcct><Id><IBAN>${inv.iban.replace(/\s+/g, "")}</IBAN></Id></CdtrAcct>
        <RmtInf><Strd><CdtrRefInf><Ref>${inv.ogm}</Ref></CdtrRefInf></Strd></RmtInf>
      </CdtTrfTxInf>`
          )
          .join("\n");

        const sepaXml = `<?xml version="1.0" encoding="UTF-8"?>
<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03">
  <CstmrCdtTrfInitn>
    <GrpHdr>
      <MsgId>${msgId}</MsgId>
      <CreDtTm>${new Date().toISOString()}</CreDtTm>
      <NbOfTxs>${selected.length}</NbOfTxs>
      <CtrlSum>${total.toFixed(2)}</CtrlSum>
      <InitgPty><Nm>Mr. De Smet q.q. Bewindvoerder ${d.name}</Nm></InitgPty>
    </GrpHdr>
    <PmtInf>
      <PmtInfId>BATCH-${d.id.toUpperCase()}</PmtInfId>
      <PmtMtd>TRF</PmtMtd>
      <Dbtr><Nm>${d.name} (Onder Bewind CRBP ${d.crbpRef})</Nm></Dbtr>
      <DbtrAcct><Id><IBAN>${d.accounts.management.iban.replace(/\s+/g, "")}</IBAN></Id></DbtrAcct>
${xmlTransactions}
    </PmtInf>
  </CstmrCdtTrfInitn>
</Document>`;

        openModal(
          "SEPA Betaalbatch (ISO 20022 pain.001.001.03) — Isabel 6 / PSD2",
          `Dossier ${d.name} • ${selected.length} transacties • Totaal: ${formatEUR(total)}`,
          `
            <div class="space-y-3">
              <div class="p-3.5 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs flex items-center justify-between">
                <span>Debetrekening: <strong>${d.accounts.management.iban}</strong> (${d.accounts.management.bank})</span>
                <span>Alle transacties worden direct doorgeboekt naar het CRBP-jaarverslag.</span>
              </div>
              <pre class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)] text-xs font-mono overflow-x-auto leading-relaxed">${sepaXml
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")}</pre>
            </div>
          `,
          `
            <button id="confirm-sepa-exec-btn" type="button" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">
              Onderteken &amp; Voer SEPA Batch Uit (${formatEUR(total)})
            </button>
          `
        );

        document.getElementById("confirm-sepa-exec-btn").addEventListener("click", () => {
          selected.forEach((inv) => {
            inv.status = "PAID";
            inv.selected = false;
            const expCat = d.annualExpenses.find((e) => e.code === inv.crbpCode);
            if (expCat) {
              expCat.amount += inv.amount;

    function downloadCrbpPdfForDossier(d) {
      const totalIncome = d.annualIncomes.reduce((s, x) => s + x.amount, 0);
      const legalFeeForfait = totalIncome * 0.03;
      const baseExpenses = d.annualExpenses.reduce((s, x) => s + x.amount, 0);
      const totalExpenses = baseExpenses + legalFeeForfait;
      const netResult = totalIncome - totalExpenses;

      const lines = [
        "PERIODIEK VERSLAG BEWINDVOERING - VREDEGERECHT (MODEL CRBP)",
        "========================================================================",
        `Bevoegde Rechtbank : ${d.canton}`,
        `CRBP Referentie    : ${d.crbpRef}`,
        `Datum Verslag      : ${new Date().toLocaleDateString("nl-BE")}`,
        "------------------------------------------------------------------------",
        "1. IDENTIFICATIE VAN DE BESCHERMDE PERSOON & HET MANDAAT",
        `Naam               : ${d.name} (Geboren: ${d.birthDate} - RRN: ${d.rrnMasked})`,
        `Verblijfplaats     : ${d.livingSituation}`,
        `Zorgprofiel        : ${d.katzScale} - ${d.mutuality}`,
        `Aanstelling        : ${d.appointmentDate} (${d.scope})`,
        `Bewindvoerder      : Mr. Jan De Smet, Advocaat`,
        "------------------------------------------------------------------------",
        "2. OVERZICHT ONTVANGSTEN PER CRBP-RUBRIEK",
        ...d.annualIncomes.map(
          (inc) => `  [${inc.code}] ${inc.description.padEnd(48, " ")} : EUR ${inc.amount.toFixed(2)}`
        ),
        `  TOTAAL ONTVANGSTEN                                    : EUR ${totalIncome.toFixed(2)}`,
        "------------------------------------------------------------------------",
        "3. OVERZICHT UITGAVEN PER CRBP-RUBRIEK",
        ...d.annualExpenses.map(
          (exp) => `  [${exp.code}] ${exp.description.padEnd(48, " ")} : EUR ${exp.amount.toFixed(2)}`
        ),
        `  [UIT-05] Ereloon & Kosten Bewindvoerder (3% Art.497/5): EUR ${legalFeeForfait.toFixed(2)}`,
        `  TOTAAL UITGAVEN                                       : EUR ${totalExpenses.toFixed(2)}`,
        `  NETTO JAARSALDO                                       : EUR ${netResult.toFixed(2)}`,
        "------------------------------------------------------------------------",
        "4. ACTUELE VERMOGENSTOESTAND & REKENINGSTANDEN",
        `  Beheerrekening (${d.accounts.management.iban})        : EUR ${d.accounts.management.balance.toFixed(2)}`,
        `  Leefgeldrekening (${d.accounts.allowance.iban})       : EUR ${d.accounts.allowance.balance.toFixed(2)}`,
        `  Spaarrekening (${d.accounts.savings.iban})            : EUR ${d.accounts.savings.balance.toFixed(2)}`,
        ...d.assets.map(
          (a) => `  Patrimonium: ${a.name.padEnd(40, " ")} : EUR ${a.estimatedValue.toFixed(2)}`
        ),
        "------------------------------------------------------------------------",
        "Ondergetekende verklaart dit verslag oprecht en volledig (Art. 499/14 BW)."
      ];

      const esc = (s) =>
        s.replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)").replace(/[^\x20-\x7E]/g, " ");
      let stream = "BT\n/F1 10 Tf\n42 790 Td\n14 TL\n";
      lines.forEach((l) => {
        stream += `(${esc(l)}) Tj T*\n`;
      });
      stream += "ET";

      const objs = [
        "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n",
        "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n",
        "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>\nendobj\n",
        "4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>\nendobj\n",
        `5 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}\nendstream\nendobj\n`
      ];

      let pdf = "%PDF-1.4\n";
      const offsets = [];
      objs.forEach((o) => {
        offsets.push(pdf.length);
        pdf += o;
      });
      const xrefPos = pdf.length;
      pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
      offsets.forEach((off) => {
        pdf += `${String(off).padStart(10, "0")} 00000 n \n`;
      });
      pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;

      const blob = new Blob([pdf], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `CRBP_Jaarverslag_${d.crbpRef.replace(/\//g, "_")}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      showToast(
        "CRBP Jaarverslag PDF Gegenereerd",
        `Het PDF-verslag voor ${d.canton} (${d.crbpRef}) is gedownload.`
      );
    }

          `

                                ? `
                                <button
                                  type="button"
                                  data-approve-req="${req.id}"
                                  class="approve-care-btn px-3 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold"
                                >
                                  Goedkeuren &amp; Budgetteren
                                </button>
                                <button
                                  type="button"
                                  data-reject-req="${req.id}"
                                  class="reject-care-btn px-2.5 py-1.5 rounded-lg border border-[var(--border)] text-xs font-medium hover:bg-[var(--secondary)]"
                                >
                                  Afwijzen
                                </button>
                              `
                                : `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)]">
                                    ${req.status === "APPROVED" ? "✓ Goedgekeurd door Bewindvoerder" : req.status === "REJECTED" ? "Geweigerd" : "In behandeling bij Bewindvoerder"}
                                  </span>`
                            }
                          </div>
                        </div>
                      `
                        )
                        .join("")}
                    </div>`
              }
            </div>
          </div>

          <!-- Right Column: Sjabloon-Automatisatie (Officiële Kennisgevingsbrieven) -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-4 h-fit">
            <div>
              <h2 class="text-base font-semibold">Sjabloon-Automatisatie (Art. 492/1 BW)</h2>
              <p class="text-xs text-[var(--muted-foreground)] mt-1">
                Verstuur met één klik officiële kennisgevingen van aanstelling bewindvoerder en adreswijziging voor briefwisseling.
              </p>
            </div>

            <div class="space-y-3 text-xs">
              ${[
                {
                  key: "fod",
                  title: "FOD Financiën & Vlaamse Belastingdienst",
                  desc: "Kennisgeving bewind + doorsturen aanslagbiljetten naar kantooradres."
                },
                {
                  key: "mutuality",
                  title: `Ziekenfonds (${d.mutuality}) & VSB`,
                  desc: "Koppeling terugbetalingen gezondheidszorg en Vlaams Zorgbudget aan beheerrekening."
                },
                {
                  key: "banks",
                  title: "Febelfin / Bankenprotocol (KBC, Belfius, BNP)",
                  desc: "Blokkering volmachten derden, activatie PSD2 beheerrekening en aparte zakgeldkaart."
                },
                {
                  key: "utilities",
                  title: "Nutsbedrijven & Leveranciers (Bescherming Deurwaarder)",
                  desc: "Melding rechterlijke bescherming om invorderingskosten op het thuisadres te vermijden."
                }
              ]
                .map(
                  (item) => `
                <div class="p-3.5 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-semibold">${item.title}</span>
                    <span class="px-2 py-0.5 rounded text-xs font-medium bg-[var(--secondary)] text-[var(--secondary-foreground)]">
                      ${d.notificationsSent[item.key] ? "✓ Verzonden" : "Nog te melden"}
                    </span>
                  </div>
                  <p class="text-[var(--muted-foreground)]">${item.desc}</p>
                  <button
                    type="button"
                    data-letter-key="${item.key}"
                    data-letter-title="${item.title}"
                    class="preview-letter-btn w-full mt-1 px-3 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] font-semibold transition-colors"
                  >
                    Genereer &amp; Verstuur Kennisgevingsbrief
                  </button>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        </div>
      `;
    }

    function bindCareEvents() {
      const d = getActiveDossier();

      // Submit new care request
      document.getElementById("new-care-request-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("care-title").value.trim();
        const amount = parseFloat(document.getElementById("care-amount").value);
        const justification = document.getElementById("care-justification").value.trim();
        if (!title || isNaN(amount)) return;

        d.careRequests.unshift({
          id: "cr-" + Date.now(),
          requesterOrg: d.livingSituation.split("(")[0].trim(),
          requesterName: state.roleMode === "care" ? "Verpleegkundige Zorgportaal" : "Kantoorinvoer",
          title,
          justification,
          amount,
          crbpCode: "UIT-03",
          date: "06/11/2026",
          status: "PENDING"
        });
        showToast(
          "Zorgaanvraag Ingediend",
          `Aanvraag "${title}" (${formatEUR(amount)}) geregistreerd voor goedkeuring.`
        );
        renderShell();
      });

      // Approve care request
      document.querySelectorAll(".approve-care-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const reqId = e.target.getAttribute("data-approve-req");
          const req = d.careRequests.find((r) => r.id === reqId);
          if (req) {
            req.status = "APPROVED";
            // Also queue it in invoices so the workflow is connected!
            d.invoices.unshift({
              id: "inv-care-" + Date.now(),
              supplier: `Terugbetaling Zorgaanvraag: ${req.title}`,
              iban: d.accounts.allowance.iban,
              amount: req.amount,
              ogm: "+++000/0000/00097+++",
              ogmValid: true,
              dueDate: "15/11/2026",
              crbpCode: req.crbpCode,
              source: "Goedgekeurd via Zorgportaal",
              confidence: 100,
              status: "READY",
              selected: true
            });
            showToast(
              "Zorgaanvraag Goedgekeurd & Klaargezet in SEPA",
              `${formatEUR(req.amount)} voor "${req.title}" is goedgekeurd en toegevoegd aan de SEPA-betaalwachtrij.`
            );
            renderShell();
          }
        });
      });

      // Reject care request
      document.querySelectorAll(".reject-care-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const reqId = e.target.getAttribute("data-reject-req");
          const req = d.careRequests.find((r) => r.id === reqId);
          if (req) {
            req.status = "REJECTED";
            showToast("Zorgaanvraag Afgewezen", `Het zorgteam heeft melding ontvangen van de beslissing.`);
            renderShell();
          }
        });
      });

      // Preview & Dispatch Official Letter
      document.querySelectorAll(".preview-letter-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const key = e.target.getAttribute("data-letter-key");
          const title = e.target.getAttribute("data-letter-title");
          openModal(
            `Officiële Kennisgeving van Bewindvoering — ${title}`,
            `Automatisch gegenereerd voor dossier ${d.name} (CRBP ${d.crbpRef})`,
            `
              <div class="p-5 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-3 text-xs font-mono leading-relaxed">
                <p><strong>AANGETEKEND / VIA EBOX ENTERPRISE</strong></p>
                <p>Aan: ${title}<br/>Betreft: Kennisgeving rechterlijke beschermingsmaatregel (Art. 492/1 Burgerlijk Wetboek)<br/>Beschermde persoon: <strong>${d.name}</strong> (RRN ${d.rrnMasked})<br/>Beschikking: <strong>${d.canton} d.d. ${d.appointmentDate} (CRBP ${d.crbpRef})</strong></p>
                <hr class="border-[var(--border)]" />
                <p>Geachte mevrouw, geachte heer,</p>
                <p>Bij beschikking van het ${d.canton} d.d. ${d.appointmentDate} werd ondergetekende, Mr. Jan De Smet, aangesteld als bewindvoerder over de goederen en de persoon van ${d.name}.</p>
                <p>Gelieve met ingang van heden:</p>
                <p>1. Alle briefwisseling, facturen en aanslagbiljetten uitsluitend te richten aan het kantooradres van de bewindvoerder (of digitaal via Peppol / CRBP-referentie ${d.crbpRef});<br/>2. Alle uitkeringen en terugbetalingen uitsluitend over te maken op beheerrekening <strong>${d.accounts.management.iban}</strong>;<br/>3. Geen rechtstreekse invorderingsmaatregelen te richten aan het verblijfsadres (${d.livingSituation}).</p>
                <p>Als bijlage vindt u een uittreksel van de aanstellingsbeschikking uit het Centraal Register.</p>
                <p>Met bijzondere hoogachting,<br/>Mr. Jan De Smet, Advocaat-Bewindvoerder</p>
              </div>
            `,
            `
              <button id="send-official-letter-btn" type="button" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">
                Digitaal Ondertekenen &amp; Verzenden (eBox / Aangetekend)
              </button>
            `
          );

          document.getElementById("send-official-letter-btn").addEventListener("click", () => {
            d.notificationsSent[key] = true;
            closeModal();
            showToast(
              "Kennisgevingsbrief Verzonden & Gearchiveerd",
              `Officiële melding aan ${title} verzonden en opgeslagen in het dossier van ${d.name}.`
            );
            renderShell();
          });
        });
      });
    }

    // =========================================================================
    // TAB 4: WONING, INVENTARIS & CONTRACTOPZEGGINGEN (VERHUIS NAAR WZC)
    // =========================================================================
    function renderEstateTab() {
      const d = getActiveDossier();
      const activeContracts = d.contracts.filter((c) => c.status === "ACTIVE");
      const monthlyActiveCost = activeContracts.reduce((s, c) => s + c.monthlyCost, 0);
      const terminatedSavingsMonthly = d.contracts
        .filter((c) => c.status === "TERMINATED")
        .reduce((s, c) => s + c.monthlyCost, 0);

      return `
        <div class="space-y-6">
          <!-- Section 1: Plaatsbeschrijving & Patrimonium (Art. 499/7 BW) -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-base font-semibold">Woning- &amp; Boedelinventaris (Aanvangsvermogensverslag &amp; Art. 499/7 BW)</h2>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                  Vastlegging van onroerende goederen, inboedel en bijzondere machtigingen van de vrederechter (bv. verkoop woning bij opname WZC).
                </p>
              </div>
              <button
                id="add-inventory-item-btn"
                type="button"
                class="px-3.5 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-semibold"
              >
                + Voeg Boedelstuk / Foto-inventaris Toe
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${d.assets
                .map(
                  (asset) => `
                <div class="p-4 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-2 text-xs">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="font-semibold text-sm text-[var(--foreground)]">${asset.name}</span>
                      <p class="text-[var(--muted-foreground)]">${asset.location}</p>
                    </div>
                    <span class="font-bold text-sm">${formatEUR(asset.estimatedValue)}</span>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 pt-1">
                    <span class="px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">${asset.category}</span>
                    <span class="px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">${asset.photoCount} Tijdstempel-foto's</span>
                  </div>
                  <p class="text-[var(--muted-foreground)] pt-1"><strong>Rechtsgrond:</strong> ${asset.judicialAuthRef}</p>
                  <p class="text-[var(--foreground)] font-medium">Status: ${asset.status}</p>
                </div>
              `
                )
                .join("")}
            </div>
          </div>

          <!-- Section 2: Contract-beëindigingshub bij verhuis naar WZC -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-base font-semibold">Contractbeëindigingshub (Opzeg Abonnementen &amp; Nutsvoorzieningen)</h2>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                  Zeg lopende abonnementen op het oude thuisadres automatisch op met bijgevoegd WZC-opnameattest en beschikking bewindvoering.
                </p>
              </div>
              <div class="flex items-center gap-3">
                <div class="text-right text-xs">
                  <p class="text-[var(--muted-foreground)]">Al gerealiseerde besparing:</p>
                  <p class="font-bold text-[var(--foreground)]">${formatEUR(terminatedSavingsMonthly * 12)} / jaar</p>
                </div>
                ${
                  activeContracts.length > 0
                    ? `<button
                        id="terminate-all-contracts-btn"
                        type="button"
                        class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold"
                      >
                        Zeg Alle ${activeContracts.length} Thuiscontracten Op (Bespaar ${formatEUR(monthlyActiveCost)}/m)
                      </button>`
                    : ""
                }
              </div>
            </div>

            ${
              d.contracts.length === 0
                ? `<p class="text-xs text-[var(--muted-foreground)] py-3">Geen op te zeggen thuiscontracten geregistreerd voor dit dossier.</p>`
                : `<div class="overflow-x-auto border border-[var(--border)] rounded-xl">
                    <table class="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">
                          <th class="py-3 px-4">Leverancier &amp; Contract</th>
                          <th class="py-3 px-4">Klant-/Contractnummer</th>
                          <th class="py-3 px-4">Reden &amp; Juridisch Bewijsstuk</th>
                          <th class="py-3 px-4 text-right">Maandkost</th>
                          <th class="py-3 px-4 text-right">Actie / Status</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-[var(--border)]">
                        ${d.contracts
                          .map(
                            (ct) => `
                          <tr class="hover:bg-[var(--background)]">
                            <td class="py-3.5 px-4 font-semibold">${ct.provider}</td>
                            <td class="py-3.5 px-4 font-mono">${ct.contractNr}</td>
                            <td class="py-3.5 px-4 text-[var(--muted-foreground)]">${ct.reason}</td>
                            <td class="py-3.5 px-4 text-right font-semibold">${formatEUR(ct.monthlyCost)} / m</td>
                            <td class="py-3.5 px-4 text-right">
                              ${
                                ct.status === "ACTIVE"
                                  ? `<button
                                      type="button"
                                      data-term-id="${ct.id}"
                                      class="term-single-btn px-3 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold"
                                    >
                                      Verstuur Opzegbrief
                                    </button>`
                                  : `<span class="px-2.5 py-1 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)] font-semibold">
                                      ✓ Opgezegd (Eindfactuur volgt)
                                    </span>`
                              }
                            </td>
                          </tr>
                        `
                          )
                          .join("")}
                      </tbody>
                    </table>
                  </div>`
            }
          </div>
        </div>
      `;
    }

    function bindEstateEvents() {
      const d = getActiveDossier();

      // Add inventory item
      document.getElementById("add-inventory-item-btn").addEventListener("click", () => {
        d.assets.push({
          id: "as-" + Date.now(),
          name: "Gouden zakhorloge & juwelenkistje (Kluis WZC)",
          location: d.livingSituation,
          estimatedValue: 1200,
          category: "Waardevolle roerende goederen",
          judicialAuthRequired: false,
          judicialAuthRef: "Toegevoegd via Mobiele Plaatsbeschrijvingsapp",
          photoCount: 4,
          status: "Geregistreerd & vergrendeld in dossier"
        });
        showToast(
          "Boedelstuk Toegevoegd aan Inventaris",
          "Nieuw item met 4 tijdstempel-foto's gekoppeld aan het CRBP-vermogensverslag."
        );
        renderShell();
      });

      // Single contract termination
      document.querySelectorAll(".term-single-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const id = e.target.getAttribute("data-term-id");
          const ct = d.contracts.find((c) => c.id === id);
          if (ct) {
            ct.status = "TERMINATED";
            showToast(
              `Contract ${ct.provider} Opgezegd`,
              `Aangetekende opzeg verzonden met WZC-attest. Jaarlijkse besparing: ${formatEUR(ct.monthlyCost * 12)}.`
            );
            renderShell();
          }
        });
      });

      // Terminate all active contracts
      const termAllBtn = document.getElementById("terminate-all-contracts-btn");
      if (termAllBtn) {
        termAllBtn.addEventListener("click", () => {
          let saved = 0;
          d.contracts.forEach((c) => {
            if (c.status === "ACTIVE") {
              c.status = "TERMINATED";
              saved += c.monthlyCost * 12;
            }
          });
          showToast(
            "Alle Thuiscontracten Opgezegd",
            `Opzegbrieven verzonden. Dit bespaart ${d.name} ${formatEUR(saved)} per jaar.`
          );
          renderShell();
        });
      }
    }

    // --- GLOBAL SHELL LISTENERS ---
    document.getElementById("dossier-select").addEventListener("change", (e) => {
      state.activeDossierId = e.target.value;
      const d = getActiveDossier();
      showToast("Dossier Gewisseld", `Actief dossier: ${d.name} (${d.crbpRef})`);
      renderShell();
    });

    document.getElementById("role-admin-btn").addEventListener("click", () => {
      state.roleMode = "admin";
      renderShell();
    });

    document.getElementById("role-care-btn").addEventListener("click", () => {
      state.roleMode = "care";
      renderShell();
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.getAttribute("data-tab");
        renderShell();
      });
    });

    // Initial render
    renderShell();
  </script>
</body>
</html>
